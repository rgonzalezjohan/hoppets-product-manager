<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Configuración Hoppets</title>

<style>

body{
    font-family: Arial, sans-serif;
    background:#f4f6f9;
    margin:0;
    padding:40px;
}

.card{
    max-width:700px;
    margin:auto;
    background:white;
    padding:35px;
    border-radius:20px;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.logo{
    text-align:center;
    margin-bottom:20px;
}

.logo img{
    width:220px;
}

h1{
    text-align:center;
    color:#1d2b64;
    margin-bottom:30px;
}

label{
    display:block;
    margin-top:15px;
    margin-bottom:6px;
    font-weight:bold;
    color:#1d2b64;
}

input,
textarea{
    width:100%;
    padding:12px;
    border:1px solid #dcdcdc;
    border-radius:10px;
    font-size:15px;
    box-sizing:border-box;
}

textarea{
    resize:vertical;
}

.btn{
    width:100%;
    margin-top:25px;
    padding:14px;
    border:none;
    border-radius:10px;
    background:#22c55e;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.btn:hover{
    background:#16a34a;
}

.volver{
    display:block;
    text-align:center;
    margin-top:20px;
    color:#1d2b64;
    text-decoration:none;
    font-weight:bold;
}

.flash-success{
    background:#d4edda;
    color:#155724;
    padding:12px;
    border-radius:10px;
    margin-bottom:20px;
    border:1px solid #28a745;
    text-align:center;
    font-weight:bold;
}

</style>

</head>
<body>

<div class="card">

    <div class="logo">
        <img src="{{ url_for('static', filename='images/logo-negro.png') }}">
    </div>

    <h1>⚙️ Configuración de Contacto</h1>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="flash-success">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST">

        <label>WhatsApp</label>
        <input
            type="text"
            name="whatsapp"
            value="{{ configuracion['whatsapp'] or '' }}"
        >

        <label>Instagram</label>
        <input
            type="text"
            name="instagram"
            value="{{ configuracion['instagram'] or '' }}"
        >

        <label>Correo</label>
        <input
            type="email"
            name="correo"
            value="{{ configuracion['correo'] or '' }}"
        >

        <label>Facebook</label>
        <input
            type="text"
            name="facebook"
            value="{{ configuracion['facebook'] or '' }}"
        >

        <label>Ciudad</label>
        <input
            type="text"
            name="ciudad"
            value="{{ configuracion['ciudad'] or '' }}"
        >

        <label>Mensaje de contacto</label>
        <textarea
            name="mensaje_contacto"
            rows="5"
        >{{ configuracion['mensaje_contacto'] or '' }}</textarea>

        <button class="btn" type="submit">
            Guardar Configuración
        </button>

    </form>

    <a class="volver" href="/admin">
        ← Volver al panel
    </a>

</div>

</body>
</html>
