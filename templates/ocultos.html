<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Productos Ocultos</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f5f7fa;
    margin:0;
    padding:40px;
}

.container{
    max-width:1000px;
    margin:auto;
}

h1{
    text-align:center;
    color:#1c274c;
    margin-bottom:30px;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 4px 15px rgba(0,0,0,.08);
}

th{
    background:#1c274c;
    color:white;
    padding:15px;
}

td{
    padding:15px;
    border-bottom:1px solid #eee;
}

.btn-restaurar{
    background:#22c55e;
    color:white;
    text-decoration:none;
    padding:8px 15px;
    border-radius:8px;
    font-weight:bold;
}

.volver{
    display:inline-block;
    margin-bottom:25px;
    text-decoration:none;
    color:#1c274c;
    font-weight:bold;
}

.logo-admin{
    text-align:center;
    margin-bottom:20px;
}

.logo-admin img{
    width:220px;
    max-width:100%;
}
</style>

</head>
<body>

<div class="logo-admin">
    <img
        src="{{ url_for('static', filename='images/logo-negro.png') }}"
        alt="Hoppets">
</div>

<h1>Productos Ocultos</h1>

<a href="/admin" class="volver">
← Volver al Panel
</a>

<table>

<tr>
    <th>ID</th>
    <th>Nombre</th>
    <th>Acción</th>
</tr>

{% for producto in productos %}

<tr>

<td>{{ producto['id'] }}</td>

<td>{{ producto['nombre'] }}</td>

<td>

<a
href="/restaurar/{{ producto['id'] }}"
class="btn-restaurar">

Restaurar

</a>

</td>

</tr>

{% endfor %}

</table>

</div>

</body>
</html>
