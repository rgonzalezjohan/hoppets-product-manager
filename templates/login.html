<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Login Hoppets</title>

<style>

body{
    font-family:Arial;
    background:#f5f7fa;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.card{
    background:white;
    padding:40px;
    border-radius:12px;
    width:350px;
    box-shadow:0 4px 15px rgba(0,0,0,.1);
}

h1{
    color:#1c274c;
    text-align:center;
}

input{
    width:100%;
    padding:12px;
    margin-bottom:15px;
    box-sizing:border-box;
}

button{
    width:100%;
    background:#22c55e;
    color:white;
    border:none;
    padding:12px;
    border-radius:8px;
    cursor:pointer;
}

.logo-admin{
    text-align:center;
    margin-bottom:20px;
}

.logo-admin img{
    width:220px;
    max-width:100%;
}

.subtitulo-admin{
    text-align:center;
    color:#64748b;
    margin-top:-10px;
    margin-bottom:25px;
}

.flash{
    padding:15px;
    border-radius:12px;
    margin-bottom:20px;
    text-align:center;
    font-weight:bold;
}

.success{
    background:#d4edda;
    color:#155724;
    border:1px solid #28a745;
}

.error{
    background:#f8d7da;
    color:#721c24;
    border:1px solid #dc3545;
}
</style>

</head>
<body>

<div class="card">

    {% with messages = get_flashed_messages(with_categories=true) %}
{% if messages %}
    {% for category, message in messages %}
        <div class="flash {{ category }}">
            {{ message }}
        </div>
    {% endfor %}
{% endif %}
{% endwith %}

        <div class="logo-admin">
            <img
                src="{{ url_for('static', filename='images/logo-negro.png') }}"
                alt="Hoppets">
        </div>

        <h1>Iniciar Sesión</h1>

<p class="subtitulo-admin">
    Panel Administrativo Hoppets
</p>
        <form method="POST">

            <input
                type="text"
                name="usuario"
                placeholder="Usuario"
                required>

            <input
                type="password"
                name="password"
                placeholder="Contraseña"
                required>

            <button type="submit">
                Ingresar
            </button>

        </form>

    </div>

</body>
</html>
