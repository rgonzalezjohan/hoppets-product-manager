<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Login Hoppets</title>

<style>

body{
    font-family:Arial;
    background:#f5f7fa;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.card{
    background:white;
    padding:40px;
    border-radius:12px;
    width:350px;
    box-shadow:0 4px 15px rgba(0,0,0,.1);
}

h1{
    color:#1c274c;
    text-align:center;
}

input{
    width:100%;
    padding:12px;
    margin-bottom:15px;
    box-sizing:border-box;
}

button{
    width:100%;
    background:#22c55e;
    color:white;
    border:none;
    padding:12px;
    border-radius:8px;
    cursor:pointer;
}

</style>

</head>
<body>

<div class="card">

<h1>🐾 Hoppets Admin</h1>

<form method="POST">

<input
type="text"
name="usuario"
placeholder="Usuario"
required>

<input
type="password"
name="password"
placeholder="Contraseña"
required>

<button type="submit">
Ingresar
</button>

</form>

</div>

</body>
</html>
