<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Cambiar Contraseña</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f5f7fa;
    padding:40px;
}

.card{
    max-width:600px;
    margin:auto;
    background:white;
    padding:40px;
    border-radius:16px;
    box-shadow:0 4px 15px rgba(0,0,0,.08);
}

h1{
    color:#1c274c;
}

.usuario{
    font-size:20px;
    font-weight:bold;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:8px;
    margin-top:10px;
}

button{
    width:100%;
    padding:14px;
    margin-top:20px;
    border:none;
    border-radius:8px;
    background:#2563eb;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    opacity:.9;
}

.logo-admin{
    text-align:center;
    margin-bottom:20px;
}

.logo-admin img{
    width:220px;
    max-width:100%;
}

</style>
</head>
<body>

<div class="card">

    <div class="logo-admin">
        <img
            src="{{ url_for('static', filename='images/logo-negro.png') }}"
            alt="Hoppets">
    </div>

    <h1>Cambiar Contraseña</h1>

<div class="usuario">
Usuario: {{ usuario['usuario'] }}
</div>

<form method="POST">

<input
type="password"
name="password"
placeholder="Nueva contraseña"
required>

<button type="submit">
Guardar nueva contraseña
</button>

</form>

<br>

<a href="/usuarios">
← Volver
</a>

</div>

</body>
</html>
